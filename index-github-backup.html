
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Young Insta</title>
<style>
body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}
h1 { color: #ff4fa3; }
.card {
  background: #191919;
  padding: 22px;
  border-radius: 18px;
  margin: 18px 0;
}
button {
  background: linear-gradient(90deg,#ff4fa3,#8b5cf6);
  color: white;
  border: none;
  padding: 15px;
  width: 100%;
  border-radius: 12px;
  margin: 8px 0;
  font-size: 16px;
}
</style>
</head>
<body>
<h1>Young Insta 🖤</h1>
<p>Your social media dashboard</p>

<div class="card">
<h3>Instagram</h3>
<button onclick="openLink('https://www.instagram.com/')">Open Instagram</button>
<button onclick="openLink('https://www.instagram.com/accounts/emailsignup/')">Create Account</button>
</div>

<div class="card">
<h3>Threads</h3>
<button onclick="openLink('https://www.threads.net/')">Open Threads</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function openLink(url) {
  tg.openLink(url);
}
</script>
</body>
</html>
